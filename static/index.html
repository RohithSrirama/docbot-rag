<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #212121;
      --sidebar-bg:    #171717;
      --surface:       #2f2f2f;
      --surface-hover: #3a3a3a;
      --border:        #3a3a3a;
      --text:          #ececec;
      --text-muted:    #8e8ea0;
      --accent:        #10a37f;
      --accent-dim:    rgba(16, 163, 127, 0.15);
      --user-bubble:   #2f2f2f;
      --input-bg:      #2f2f2f;
      --scrollbar:     #444;
      --radius:        12px;
      --font:          'Inter', system-ui, sans-serif;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      transition: width 0.25s ease;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; min-width: 0; border-right: none; }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #new-chat-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    #new-chat-btn:hover { background: var(--surface-hover); color: var(--text); }

    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    #history-list::-webkit-scrollbar { width: 4px; }
    #history-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }
    .history-item:hover { background: var(--surface-hover); color: var(--text); }
    .history-item.active { background: var(--surface); color: var(--text); }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    #toggle-sidebar {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
    }
    #toggle-sidebar:hover { color: var(--text); background: var(--surface); }

    #topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    /* ── Chat window ── */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      scroll-behavior: smooth;
    }
    #chat-container::-webkit-scrollbar { width: 6px; }
    #chat-container::-webkit-scrollbar-track { background: transparent; }
    #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    #messages-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
    }

    /* ── Welcome screen ── */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 12px;
      padding: 40px 16px;
    }
    #welcome h1 {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    #welcome p {
      font-size: 15px;
      color: var(--text-muted);
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      max-width: 560px;
    }
    .suggestion-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1.5;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .suggestion-card:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--accent);
    }

    /* ── Message bubbles ── */
    .message-row {
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: fadeUp 0.22s ease;
    }
    .message-row:last-child { border-bottom: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-role {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .message-row.user .message-role { color: var(--accent); }
    .message-row.user { align-items: flex-end; }
    .message-row.user .message-content {
      background: var(--user-bubble);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: inline-block;
      max-width: 80%;
      align-self: flex-end;
    }

    .message-content {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Blinking cursor */
    .cursor::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--text-muted);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Sources ── */
    .sources-row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .sources-label { font-size: 12px; color: var(--text-muted); }
    .source-pill {
      font-size: 12px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(16,163,127,0.3);
      border-radius: 99px;
      padding: 2px 10px;
    }

    /* ── Input area ── */
    #input-area {
      padding: 16px 16px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #input-inner {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }
    #input-box {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      padding: 14px 56px 14px 18px;
      resize: none;
      outline: none;
      max-height: 200px;
      overflow-y: auto;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input-box::placeholder { color: var(--text-muted); }
    #input-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16,163,127,0.12);
    }
    #input-box::-webkit-scrollbar { width: 4px; }
    #input-box::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; }

    #send-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #0d8f6f; transform: scale(1.05); }
    #send-btn:disabled { background: #2d5c52; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: #fff; }

    #input-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Conversations</span>
    <button id="new-chat-btn">New chat</button>
  </div>
  <div id="history-list"></div>
  <div class="sidebar-footer">DocBot — Document Assistant</div>
</aside>

<!-- Main -->
<section id="main">
  <header id="topbar">
    <button id="toggle-sidebar" title="Toggle sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span id="topbar-title">DocBot</span>
  </header>

  <div id="chat-container">
    <div id="messages-inner">
      <div id="welcome">
        <h1>What can I help you with?</h1>
        <p>Ask questions about your company documents — policies, procedures, HR guidelines, and more.</p>
        <div class="suggestion-grid" id="suggestions"></div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-inner">
      <textarea id="input-box" rows="1" placeholder="Ask something..." autocomplete="off"></textarea>
      <button id="send-btn" title="Send" disabled>
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <p id="input-hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
  </div>
</section>

<script>
  // ─────────────────────────────────────────────
  //  Markdown stripper (safety net for model output)
  // ─────────────────────────────────────────────
  function stripMarkdown(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/_(.+?)_/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/`(.+?)`/g, '$1')
      .replace(/^[\s]*[-*•]\s+/gm, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  // ─────────────────────────────────────────────
  //  State
  // ─────────────────────────────────────────────
  const SESSION_KEY = "docbot_session";
  let sessionId = localStorage.getItem(SESSION_KEY) || crypto.randomUUID();
  localStorage.setItem(SESSION_KEY, sessionId);

  let isStreaming = false;

  // Active conversation messages: [{role, text, sources}]
  let conversationHistory = [];

  // All saved sessions: [{id, title, history[]}]
  // Newest is always at index 0
  let chatSessions = [];

  // Index into chatSessions of the currently viewed session.
  // -1 means the current chat has NOT been saved yet (in-progress).
  let activeSessionIndex = -1;

  // ─────────────────────────────────────────────
  //  DOM refs
  // ─────────────────────────────────────────────
  const chatContainer = document.getElementById("chat-container");
  const messagesInner = document.getElementById("messages-inner");
  const welcome       = document.getElementById("welcome");
  const inputBox      = document.getElementById("input-box");
  const sendBtn       = document.getElementById("send-btn");
  const newChatBtn    = document.getElementById("new-chat-btn");
  const sidebar       = document.getElementById("sidebar");
  const toggleBtn     = document.getElementById("toggle-sidebar");
  const historyList   = document.getElementById("history-list");
  const suggestionGrid = document.getElementById("suggestions");

  // ─────────────────────────────────────────────
  //  Suggestion cards
  // ─────────────────────────────────────────────
  const SUGGESTIONS = [
    "What is the refund policy?",
    "How many sick days are allowed per year?",
    "What are the remote work requirements?",
    "What exceptions apply to the refund window?",
  ];

  SUGGESTIONS.forEach(text => {
    const card = document.createElement("div");
    card.className = "suggestion-card";
    card.textContent = text;
    card.addEventListener("click", () => sendMessage(text));
    suggestionGrid.appendChild(card);
  });

  // ─────────────────────────────────────────────
  //  Input events
  // ─────────────────────────────────────────────
  inputBox.addEventListener("input", () => {
    sendBtn.disabled = !inputBox.value.trim() || isStreaming;
    inputBox.style.height = "auto";
    inputBox.style.height = Math.min(inputBox.scrollHeight, 200) + "px";
  });

  inputBox.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage(inputBox.value.trim());
    }
  });

  sendBtn.addEventListener("click", () => {
    if (!sendBtn.disabled) sendMessage(inputBox.value.trim());
  });

  toggleBtn.addEventListener("click", () => sidebar.classList.toggle("collapsed"));

  // ─────────────────────────────────────────────
  //  Session management
  // ─────────────────────────────────────────────

  /** Persist the current conversation into chatSessions before switching away. */
  function saveCurrentSession() {
    if (conversationHistory.length === 0) return;
    const firstUser = conversationHistory.find(m => m.role === "user");
    const title = firstUser ? firstUser.text.slice(0, 55) : "Conversation";

    if (activeSessionIndex === -1) {
      // Brand-new session — push to front
      chatSessions.unshift({ id: sessionId, title, history: [...conversationHistory] });
      activeSessionIndex = 0;
    } else {
      // Update existing saved session in place
      chatSessions[activeSessionIndex].title   = title;
      chatSessions[activeSessionIndex].history = [...conversationHistory];
    }
  }

  newChatBtn.addEventListener("click", () => {
    if (isStreaming) return;

    saveCurrentSession();        // keep previous chat in sidebar
    sessionId = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, sessionId);

    conversationHistory  = [];
    activeSessionIndex   = -1;

    // Tell backend to clear this new session (fire-and-forget)
    fetch("/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    }).catch(() => {});

    renderMessages();
    renderSidebar();
  });

  /** Switch the main view to a previously saved session. */
  function loadSession(index) {
    if (isStreaming) return;

    saveCurrentSession();

    activeSessionIndex   = index;
    conversationHistory  = [...chatSessions[index].history];
    sessionId            = chatSessions[index].id;
    localStorage.setItem(SESSION_KEY, sessionId);

    renderMessages();
    renderSidebar();
  }

  // ─────────────────────────────────────────────
  //  Sidebar rendering
  // ─────────────────────────────────────────────

  function renderSidebar() {
    historyList.innerHTML = "";

    chatSessions.forEach((session, index) => {
      const item = document.createElement("div");
      item.className = "history-item" + (index === activeSessionIndex ? " active" : "");
      item.textContent = session.title;
      item.title = session.title;  // full text on hover
      item.addEventListener("click", () => loadSession(index));
      historyList.appendChild(item);
    });
  }

  /**
   * Called as soon as the user sends their first message in a new chat.
   * Adds a live "active" entry at the top of the sidebar immediately,
   * so the user can see the current chat in the list right away.
   */
  function pushCurrentChatToSidebar() {
    const firstUser = conversationHistory.find(m => m.role === "user");
    if (!firstUser) return;
    const title = firstUser.text.slice(0, 55);

    if (activeSessionIndex === -1) {
      // Check if there is already a live placeholder
      const existing = historyList.querySelector(".history-item.active");
      if (existing) {
        existing.textContent = title;
        existing.title = title;
      } else {
        const item = document.createElement("div");
        item.className = "history-item active";
        item.textContent = title;
        item.title = title;
        // Clicking the current active chat does nothing (you're already on it)
        item.addEventListener("click", () => {});
        historyList.prepend(item);
      }
    } else {
      // Session already saved — just re-render to update title if needed
      renderSidebar();
    }
  }

  // ─────────────────────────────────────────────
  //  Message rendering
  // ─────────────────────────────────────────────

  function renderMessages() {
    messagesInner.innerHTML = "";

    if (conversationHistory.length === 0) {
      messagesInner.appendChild(welcome);
      return;
    }

    conversationHistory.forEach(msg => {
      if (msg.role === "user") {
        messagesInner.appendChild(buildUserRow(msg.text));
      } else {
        messagesInner.appendChild(buildBotRow(msg.text, msg.sources || [], false));
      }
    });

    scrollToBottom();
  }

  function buildUserRow(text) {
    const row = document.createElement("div");
    row.className = "message-row user";
    row.innerHTML = `<div class="message-role">You</div>
                     <div class="message-content">${escHtml(text)}</div>`;
    return row;
  }

  function buildBotRow(text, sources, withCursor) {
    const row = document.createElement("div");
    row.className = "message-row assistant";

    const roleDiv = document.createElement("div");
    roleDiv.className = "message-role";
    roleDiv.textContent = "DocBot";

    const contentDiv = document.createElement("div");
    contentDiv.className = "message-content" + (withCursor ? " cursor" : "");
    contentDiv.textContent = text;

    row.appendChild(roleDiv);
    row.appendChild(contentDiv);

    if (sources && sources.length) {
      row.appendChild(buildSourcesRow(sources));
    }

    return row;
  }

  function buildSourcesRow(sources) {
    const div = document.createElement("div");
    div.className = "sources-row";

    const label = document.createElement("span");
    label.className = "sources-label";
    label.textContent = "Sources:";
    div.appendChild(label);

    sources.forEach(s => {
      const pill = document.createElement("span");
      pill.className = "source-pill";
      pill.textContent = s;
      div.appendChild(pill);
    });

    return div;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // ─────────────────────────────────────────────
  //  Send message
  // ─────────────────────────────────────────────

  async function sendMessage(text) {
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;

    inputBox.value = "";
    inputBox.style.height = "auto";

    // Remove welcome screen on first message
    if (welcome.parentNode) welcome.remove();

    // Add user message to state and DOM
    conversationHistory.push({ role: "user", text });
    messagesInner.appendChild(buildUserRow(text));

    // Show the current chat in the sidebar immediately
    pushCurrentChatToSidebar();

    // Add empty bot placeholder
    let botText = "";
    const botRow    = buildBotRow("", [], true);
    const contentEl = botRow.querySelector(".message-content");
    messagesInner.appendChild(botRow);
    scrollToBottom();

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!resp.ok) throw new Error("Server error " + resp.status);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();   // keep incomplete line for next chunk

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;

          let payload;
          try { payload = JSON.parse(raw); } catch { continue; }

          if (payload.token !== undefined) {
            botText += payload.token;
            contentEl.textContent = stripMarkdown(botText);
            scrollToBottom();
          }

          if (payload.done) {
            contentEl.classList.remove("cursor");
            const cleanText = stripMarkdown(botText);
            contentEl.textContent = cleanText;

            const sources = payload.sources || [];
            conversationHistory.push({ role: "assistant", text: cleanText, sources });

            if (sources.length) {
              botRow.appendChild(buildSourcesRow(sources));
            }
          }
        }
      }
    } catch (err) {
      contentEl.classList.remove("cursor");
      contentEl.textContent = "Something went wrong. Please try again.";
      conversationHistory.push({ role: "assistant", text: contentEl.textContent, sources: [] });
    } finally {
      isStreaming = false;
      sendBtn.disabled = !inputBox.value.trim();
      scrollToBottom();
    }
  }

  // ─────────────────────────────────────────────
  //  Init
  // ─────────────────────────────────────────────
  renderMessages();
  renderSidebar();
</script>
</body>
</html>
